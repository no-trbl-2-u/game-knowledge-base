name: Board-game intake evidence gap
description: Record blocked research without opening a report PR
title: "[intake-gap] "
body:
  - type: markdown
    attributes:
      value: |
        Use this only when a candidate cannot reach `ready_for_audit`. Do not commit a blocked intake packet. Update and close this issue when the missing evidence is retrieved.
  - type: input
    id: game
    attributes:
      label: Game and edition
      description: Exact title, edition, printing, language, and platform scope.
    validations:
      required: true
  - type: dropdown
    id: cohort
    attributes:
      label: Intake cohort
      options:
        - cooperative
        - solo_rpg
        - rotating_focus
    validations:
      required: true
  - type: textarea
    id: coverage
    attributes:
      label: Measured coverage
      description: Give recorded, known total, percentage, denominator source, and methodology for rules and factual coverage.
    validations:
      required: true
  - type: textarea
    id: missing
    attributes:
      label: Missing evidence
      description: List each governing document, factual denominator, reception source, or visual source still required.
    validations:
      required: true
  - type: textarea
    id: attempts
    attributes:
      label: Retrieval attempts
      description: Record exact URLs, tools or methods, timestamps, and observed outcomes. No-result is not negative proof.
    validations:
      required: true
  - type: textarea
    id: help
    attributes:
      label: How T can unblock it
      description: State the smallest concrete document, access, edition decision, or source lead needed.
    validations:
      required: true
  - type: textarea
    id: retained
    attributes:
      label: Retained evidence
      description: Link lawful external receipts or local non-repository evidence paths; do not attach copyrighted source corpora.
    validations:
      required: true