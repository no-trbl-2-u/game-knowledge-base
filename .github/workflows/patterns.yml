name: patterns

# Weekly cross-game synthesis (see .claude/commands/synthesize-patterns.md):
# folds the week's new game docs into patterns/<label>.okf.md, keyed to the
# better-if taxonomy and major mechanics. Delivers one commit on a
# patterns/<date> branch and opens a PR against protected main. Scheduled
# before the daily 06:00 UTC scout so the two never collide.

on:
  schedule:
    - cron: '17 5 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: kb-maintenance
  cancel-in-progress: false

jobs:
  patterns:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The pass names its branch patterns/<YYYY-MM-DD>; capture the date
      # before the agent starts so the check below looks for the same name.
      - name: Capture run date
        id: run
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Run Claude (patterns synthesis)
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GH_PAT || github.token }}
          prompt: '/synthesize-patterns'
          claude_args: |
            -p
            --dangerously-skip-permissions
            --model claude-sonnet-5
            --allowedTools "Bash,Edit,Write,Read,Glob,Grep,Task,TodoWrite,WebFetch,WebSearch"

      # Every patterns run must log to RUNLOG.md, even a no-op — the
      # 2026-07-05 incident was a run that ended silently and left no
      # evidence it had happened. Prose alone didn't hold; this does.
      #
      # The check inspects what reached origin, not the runner's local clone:
      # a local-only commit used to satisfy a pre..HEAD grep and then vanish
      # with the runner. main is protected, so the pass delivers as a
      # patterns/<date> branch plus a PR — both must exist, and the branch
      # must carry a RUNLOG commit beyond origin/main.
      - name: Enforce RUNLOG rule
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          branch="patterns/${{ steps.run.outputs.date }}"
          if ! git fetch origin main "$branch"; then
            echo "::error title=Silent patterns run::origin has no branch $branch. Every run pushes patterns/<date> and opens a PR, even for a no-op (see the 2026-07-05 incident in RUNLOG.md)."
            exit 1
          fi
          if ! git log "origin/main..origin/$branch" --name-only --format= \
              | grep -q '^KnowledgeBase/BoardGames/patterns/RUNLOG.md$'; then
            echo "::error title=Silent patterns run::No commit on origin/$branch beyond origin/main touches KnowledgeBase/BoardGames/patterns/RUNLOG.md. Every run logs, even no-ops (see the 2026-07-05 incident in RUNLOG.md)."
            exit 1
          fi
          pr="$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number')"
          if [ -z "$pr" ]; then
            echo "::error title=Unopened patterns PR::origin/$branch carries the RUNLOG row but no open PR targets main from it. The pass must finish with gh pr create."
            exit 1
          fi
          echo "RUNLOG row pushed on $branch and PR #$pr is open — rule satisfied."
