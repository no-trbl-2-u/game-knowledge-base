name: check-links

# Weekly source-URL liveness sweep (scripts/check-links.mjs — plain node,
# no AI, no tokens). Dead links get filed/appended to an open `link-rot`
# issue; the monthly /audit pass consumes that issue and decides the
# remediation (alternate source, wayback snapshot, confidence downgrade).
# Suspect links (bot walls, 403/429, timeouts) are reported in the log but
# never fail the job. Monday, before the daily 06:00 UTC scout.

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: kb-maintenance
  cancel-in-progress: false

jobs:
  check-links:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Probe source URLs
        id: probe
        shell: bash
        run: |
          set +e
          node scripts/check-links.mjs | tee report.txt
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: File or update the link-rot issue
        if: ${{ steps.probe.outputs.code == '1' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          {
            echo "Weekly sweep found dead source URLs (run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
            echo
            echo '```'
            cat report.txt
            echo '```'
            echo
            echo "Remediation belongs to the monthly /audit pass: alternate source, wayback snapshot, or confidence downgrade — never silent deletion."
          } > body.md
          gh label create link-rot --description "dead source URLs found by check-links" --color d93f0b 2>/dev/null || true
          existing=$(gh issue list --label link-rot --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file body.md
          else
            gh issue create --title "link-rot: dead source URLs in the corpus" --label link-rot --body-file body.md
          fi
