name: validate

# Structural OKF validation plus the fail-closed one-PR/two-role intake boundary.
# Plain scripts, no model and no token spend. This workflow runs on every PR
# because main requires its status; path filtering would leave unrelated PRs
# permanently waiting for a check that never starts.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install visual-gate dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Verify visual-gate dependency
        run: ffmpeg -version
      - name: Test intake provenance and visual gates
        run: node --test scripts/intake-lib.test.mjs scripts/validate-intake-package.test.mjs scripts/fail-closed.test.mjs scripts/validate-okf-provenance.test.mjs
      - name: Validate intake diff (pull request)
        if: github.event_name == 'pull_request'
        run: node scripts/validate-intake.mjs --base "${{ github.event.pull_request.base.sha }}" --synthetic-merge
      - name: Validate intake diff (push)
        if: github.event_name == 'push'
        run: node scripts/validate-intake.mjs --base "${{ github.event.before }}" --require-merge-commit
      - name: Validate OKF
        run: node scripts/validate-okf.mjs
      - name: Test OKF visual validator
        run: node --test scripts/validate-okf-visuals.test.mjs
      - name: Test telemetry delivery invariants
        run: node --test scripts/telemetry-delivery.test.mjs
      - name: Test event-driven correction-loop contract
        run: node --test scripts/kb-loop-contract.test.mjs
      - name: Self-test write guard
        run: node .claude/hooks/okf-guard.mjs self-test

  # Separate from `validate` on purpose. `validate` must be able to pass on a
  # pre-approval `ready_for_audit` head, or the audit that produces promotion
  # can never begin. This check is the merge barrier for that same head: it
  # stays red until approval and promotion land, so a packet cannot reach
  # protected `main` unaudited — including via auto-merge. Both must be
  # required status checks; neither substitutes for the other.
  intake-complete:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require promoted intake before merge
        run: node scripts/validate-intake.mjs --base "${{ github.event.pull_request.base.sha }}" --synthetic-merge --completion-only
