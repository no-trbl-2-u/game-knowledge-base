name: validate

# The corpus's type-checker: structural OKF validation on every change.
# Plain script, no model, no tokens.
#
# BLOCKING since 2026-07-04: the librarian's first pass brought the corpus
# to 0 findings, so drift now fails CI the day it lands.

on:
  push:
    branches: [main]
    paths:
      - 'KnowledgeBase/**'
      - 'scripts/validate-okf.mjs'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'KnowledgeBase/**'
      - 'scripts/validate-okf.mjs'
      - '.github/workflows/validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate OKF corpus
        run: node scripts/validate-okf.mjs
